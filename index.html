<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mon Emploi du Temps — Premium Design</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app" id="app">
        <!-- Header avec effet glassmorphism -->
        <header class="app-header" role="banner">
            <div class="header-content">
                <div class="brand">
                    <div class="logo">
                        <i class="fas fa-calendar-check"></i>
                    </div>
                    <div class="brand-text">
                        <h1>Mon Emploi du Temps</h1>
                        <p>Organisez votre semaine avec style</p>
                    </div>
                </div>

                <div class="controls">
                    <!-- View Toggle -->
                    <div class="view-toggle" role="tablist">
                        <button class="toggle-btn active" id="btnWeek" aria-pressed="true" data-view="week">
                            <i class="fas fa-th"></i>
                            <span>Semaine</span>
                        </button>
                        <button class="toggle-btn" id="btnDay" aria-pressed="false" data-view="day">
                            <i class="fas fa-list"></i>
                            <span>Jour</span>
                        </button>
                        <div class="toggle-indicator"></div>
                    </div>

                    <!-- Search -->
                    <div class="search-wrapper" role="search">
                        <i class="fas fa-search search-icon"></i>
                        <input type="search" id="searchInput" placeholder="Rechercher..." class="search-input" />
                        <button class="search-clear" id="resetFilters" title="Effacer">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>

                    <!-- Export Button -->
                    <button class="icon-btn export-btn" title="Exporter">
                        <i class="fas fa-download"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Stats Cards avec animations -->
        <section class="stats-grid">
            <div class="stat-card stat-ecole" data-category="ecole">
                <div class="stat-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-value" id="statEcoleValue">0h</div>
                    <div class="stat-label">Cours école</div>
                    <div class="stat-progress">
                        <div class="stat-progress-bar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="stat-bg-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
            </div>

            <div class="stat-card stat-transport" data-category="transport">
                <div class="stat-icon">
                    <i class="fas fa-bus"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-value" id="statTransportValue">0h</div>
                    <div class="stat-label">Transport</div>
                    <div class="stat-progress">
                        <div class="stat-progress-bar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="stat-bg-icon">
                    <i class="fas fa-bus"></i>
                </div>
            </div>

            <div class="stat-card stat-personnel" data-category="personnel">
                <div class="stat-icon">
                    <i class="fas fa-user"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-value" id="statPersonnelValue">0h</div>
                    <div class="stat-label">Personnel</div>
                    <div class="stat-progress">
                        <div class="stat-progress-bar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="stat-bg-icon">
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <div class="stat-card stat-repos" data-category="repos">
                <div class="stat-icon">
                    <i class="fas fa-mug-hot"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-value" id="statReposValue">0h</div>
                    <div class="stat-label">Repos</div>
                    <div class="stat-progress">
                        <div class="stat-progress-bar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="stat-bg-icon">
                    <i class="fas fa-mug-hot"></i>
                </div>
            </div>
        </section>

        <!-- Main Content -->
        <main class="main-content" role="main">
            <!-- Week View -->
            <div id="weekView" class="week-view active">
                <div class="week-grid" id="weekGrid"></div>
            </div>

            <!-- Day View -->
            <div id="dayView" class="day-view">
                <div class="day-selector-wrapper">
                    <div class="day-selector" id="daySelector"></div>
                </div>
                <div class="timeline-wrapper">
                    <div class="timeline" id="timeline"></div>
                </div>
            </div>
        </main>

        <!-- Floating Action Button -->
        <button class="fab" id="openModalBtn" title="Ajouter une activité">
            <i class="fas fa-plus"></i>
            <span class="fab-ripple"></span>
        </button>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title">
                    <i class="fas fa-calendar-plus"></i>
                    <h2 id="modalTitle">Ajouter une activité</h2>
                </div>
                <button class="modal-close" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="scheduleForm" class="modal-form">
                <input type="hidden" id="scheduleId">

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-calendar-day"></i>
                        Jour de la semaine
                    </label>
                    <select id="dayOfWeek" class="form-control" required>
                        <option value="">Sélectionner un jour</option>
                        <option value="lundi">Lundi</option>
                        <option value="mardi">Mardi</option>
                        <option value="mercredi">Mercredi</option>
                        <option value="jeudi">Jeudi</option>
                        <option value="vendredi">Vendredi</option>
                        <option value="samedi">Samedi</option>
                        <option value="dimanche">Dimanche</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-clock"></i>
                            Heure de début
                        </label>
                        <input type="time" id="startTime" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-clock"></i>
                            Heure de fin
                        </label>
                        <input type="time" id="endTime" class="form-control" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-pencil-alt"></i>
                        Activité
                    </label>
                    <input type="text" id="activity" class="form-control" placeholder="Ex: Cours de mathématiques" required>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-tag"></i>
                        Catégorie
                    </label>
                    <div class="category-grid">
                        <label class="category-option" data-category="ecole">
                            <input type="radio" name="category" value="ecole">
                            <span class="category-card">
                                <i class="fas fa-graduation-cap"></i>
                                <span>École</span>
                            </span>
                        </label>
                        <label class="category-option" data-category="transport">
                            <input type="radio" name="category" value="transport">
                            <span class="category-card">
                                <i class="fas fa-bus"></i>
                                <span>Transport</span>
                            </span>
                        </label>
                        <label class="category-option" data-category="personnel">
                            <input type="radio" name="category" value="personnel">
                            <span class="category-card">
                                <i class="fas fa-user"></i>
                                <span>Personnel</span>
                            </span>
                        </label>
                        <label class="category-option" data-category="repos">
                            <input type="radio" name="category" value="repos">
                            <span class="category-card">
                                <i class="fas fa-mug-hot"></i>
                                <span>Repos</span>
                            </span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-map-marker-alt"></i>
                        Lieu (optionnel)
                    </label>
                    <input type="text" id="location" class="form-control" placeholder="Ex: Salle 203">
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-sticky-note"></i>
                        Notes (optionnel)
                    </label>
                    <textarea id="notes" class="form-control" rows="3" placeholder="Ajoutez des notes..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">
                        <i class="fas fa-times"></i>
                        Annuler
                    </button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">
                        <i class="fas fa-save"></i>
                        Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
